      var fresh = parseTags(raw);
      if (!fresh.length) return;
      p.tags = p.tags || [];
      var have = {};
      p.tags.forEach(function (t) { have[t.toLowerCase()] = 1; });
      fresh.forEach(function (t) { if (!have[t.toLowerCase()]) p.tags.push(t); });
      savePlaces(); renderDetail();
    });
    var newTagsInput = document.getElementById('newTags');
    newTagsInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addTags').click(); }
    });
    body.querySelectorAll('[data-deltag]').forEach(function (b) {
      b.addEventListener('click', function () {
        p.tags.splice(parseInt(b.getAttribute('data-deltag'), 10), 1);
        savePlaces(); renderDetail();
      });
    });
    body.querySelectorAll('[data-sugtag]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tg = b.getAttribute('data-sugtag');
        p.tags = p.tags || [];
        if (!hasTag(p, tg)) p.tags.push(tg);
        savePlaces(); renderDetail();
      });
    });
    document.getElementById('addMemory').addEventListener('click', function () {
      var t = document.getElementById('newMemory').value.trim();
      if (!t) return;
      p.memories.push({ date: today(), text: t });
      savePlaces(); renderDetail();
      toast('Memory saved');
    });
    document.getElementById('saveNext').addEventListener('click', function () {
      p.nextTime = document.getElementById('nextTime').value.trim();
      savePlaces();
      toast('Saved for next time');
    });
    document.getElementById('deletePlace').addEventListener('click', function () {
      if (!confirm('Remove ' + p.name + ' and its memories?')) return;
      (p.photos || []).forEach(function (id) { delPhoto(id); delete photoUrls[id]; });
      places = places.filter(function (x) { return x.id !== p.id; });
      savePlaces();
      view.mode = 'list'; view.placeId = null;
      refreshMarkers(); render(); updateStats();
    });
  }

  // ----- Passport -----
  function renderPassport() {
    var been = places.filter(function (p) { return p.status === 'been'; });
    var want = places.length - been.length;
    var countries = {}, cities = {};
    been.forEach(function (p) {
      if (p.country) countries[p.country] = (countries[p.country] || 0) + 1;
      if (p.city) cities[cityKey(p)] = 1;
    });
    var countryList = Object.keys(countries).sort(function (a, b) { return countries[b] - countries[a]; });
    var nMemories = 0, nPhotos = 0;
    places.forEach(function (p) {
      nMemories += (p.memories || []).length;
      nPhotos += (p.photos || []).length;
    });
    var catCounts = {};
    Object.keys(CAT).forEach(function (k) { catCounts[k] = 0; });
    been.forEach(function (p) { if (catCounts[p.cat] != null) catCounts[p.cat]++; });
    var maxCat = Math.max.apply(null, Object.keys(catCounts).map(function (k) { return catCounts[k]; }).concat([1]));
    var firstDate = null;
    places.forEach(function (p) {
      var d = new Date(p.added);
      if (!isNaN(d) && (!firstDate || d < firstDate)) firstDate = d;
    });
    var tags = allTags().slice(0, 8);

    var html = '<div class="pp-grid">' +
      '<div class="pp-cell"><div class="pp-num">' + countryList.length + '</div><div class="pp-lbl">Countries</div></div>' +
      '<div class="pp-cell"><div class="pp-num">' + Object.keys(cities).length + '</div><div class="pp-lbl">Cities</div></div>' +
      '<div class="pp-cell"><div class="pp-num">' + been.length + '</div><div class="pp-lbl">Places</div></div>' +
      '<div class="pp-cell"><div class="pp-num">' + trips.length + '</div><div class="pp-lbl">Trips</div></div>' +
      '</div>';

    html += '<div class="pp-section"><span class="field-label">Stamps <span class="soft">(tap one)</span></span>';
    if (countryList.length) {
      html += '<div class="stamp-grid">';
      countryList.forEach(function (c) {
        html += '<button class="stamp-btn" data-country="' + esc(c) + '">' +
          '<span class="stamp-box" style="--ink-c:' + countryColor(c) + ';"><span class="stamp-air">✈</span>' +
          '<span class="stamp-n">' + countries[c] + (countries[c] === 1 ? ' place' : ' places') + '</span></span>' +
          '<span class="stamp-country">' + esc(c) + '</span>' +
          '</button>';
      });
      html += '</div>';
    } else {
      html += '<div class="card-sub">No stamps yet — pin somewhere you’ve been.</div>';
    }
    html += '</div>';

    html += '<div class="pp-section"><span class="field-label">How you travel</span>';
    Object.keys(CAT).forEach(function (k) {
      var pct = Math.round(catCounts[k] / maxCat * 100);
      html += '<div class="pp-bar-row"><span class="lbl">' + CAT[k].label + '</span>' +
        '<div class="pp-bar"><span style="width:' + pct + '%;background:' + CAT[k].color + ';"></span></div>' +
        '<span class="n">' + catCounts[k] + '</span></div>';
    });
    html += '</div>';

    html += '<div class="pp-section"><span class="field-label">The record</span>' +
      '<div class="settings-note">' +
      nMemories + (nMemories === 1 ? ' memory' : ' memories') + ' written · ' +
      nPhotos + (nPhotos === 1 ? ' photo' : ' photos') + ' kept' +
      (want ? ' · ' + want + ' place' + (want === 1 ? '' : 's') + ' on the wishlist' : '') +
      (firstDate ? '<br>Keeping souvenirs since ' + esc(firstDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })) : '') +
      '</div></div>';

    if (tags.length) {
      html += '<div class="pp-section"><span class="field-label">Your words</span><div class="tag-row">' +
        tags.map(function (t) { return '<span class="tag-chip">#' + esc(t) + '</span>'; }).join('') +
        '</div></div>';
    }
    body.innerHTML = html;

    body.querySelectorAll('.stamp-btn[data-country]').forEach(function (el) {
      el.addEventListener('click', function () {
        view.mode = 'country';
        view.countryName = el.getAttribute('data-country');
        render();
      });
    });
  }

  // ----- Country drill-down (from a passport stamp) -----
  function renderCountry() {
    var name = view.countryName;
    var cPlaces = places.filter(function (p) { return p.country === name; });
    if (!cPlaces.length) { view.mode = 'list'; render(); return; }
    if (view.countryFocus !== name) {
      view.countryFocus = name;
      refreshMarkers();
      map.fitBounds(L.latLngBounds(cPlaces.map(function (p) { return [p.lat, p.lng]; })).pad(0.3), { maxZoom: 10 });
    }
    var cities = {};
    cPlaces.forEach(function (p) { if (p.city) cities[p.city] = 1; });
    var cTrips = trips.filter(function (t) {
      return cPlaces.some(function (p) { return p.tripId === t.id; });
    });

    var html = '<div class="card-pane" style="padding-bottom:8px;">' +
      '<div class="card-top"><button class="back-btn" id="backBtn">← Passport</button></div>' +
      '<div><h2>' + esc(name) + '</h2>' +
      '<div class="card-sub" style="margin-top:4px;">' + cPlaces.length + (cPlaces.length === 1 ? ' place' : ' places') +
      ' · ' + Object.keys(cities).length + (Object.keys(cities).length === 1 ? ' city' : ' cities') + '</div></div></div>';

    if (cTrips.length) {
      html += '<div class="card-pane" style="padding-top:0;padding-bottom:0;"><span class="field-label">Trips here</span></div>';
      cTrips.forEach(function (t) { html += tripCardHtml(t); });
    }

    html += '<div class="card-pane" style="padding-top:10px;padding-bottom:0;"><span class="field-label">Places</span></div>';
    var groups = {};
    cPlaces.forEach(function (p) { (groups[p.city || 'Elsewhere'] = groups[p.city || 'Elsewhere'] || []).push(p); });
    Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).forEach(function (city) {
      html += '<div class="city-group"><div class="city-title" style="cursor:default;">' + esc(city) +
        ' <span class="n">' + groups[city].length + '</span></div>';
      groups[city].forEach(function (p) { html += placeRowHtml(p); });
      html += '</div>';
    });
    body.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function () {
      view.mode = 'list'; view.tab = 'passport'; render();
    });
    body.querySelectorAll('[data-trip]').forEach(function (el) {
      el.addEventListener('click', function () {
        view.mode = 'trip'; view.tab = 'trips'; view.tripId = el.getAttribute('data-trip');
        render();
      });
    });
    body.querySelectorAll('[data-open]').forEach(function (el) {
      el.addEventListener('click', function () { openPlace(el.getAttribute('data-open')); });
    });
    fillTripThumbs();
  }

        return f.text().then(function (txt) { return importTakeout(f.name, txt); });

        var added = 0, skipped = 0;
        results.forEach(function (r) { added += r.added; skipped += r.skipped; });
        savePlaces(); refreshMarkers(); updateStats();
        toast('Imported ' + added + ' place' + (added === 1 ? '' : 's') +
          (skipped ? ' (' + skipped + ' skipped — no coordinates)' : ''));

  // ----- Google Takeout parsing -----
  function cityFromAddress(addr) {
    if (!addr) return { city: '', country: '' };
    var parts = addr.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) return { city: '', country: '' };
    var country = parts[parts.length - 1];
    var city = '';
    for (var i = parts.length - 2; i >= 1 && !city; i--) {
      // strip postal codes / state abbreviations: keep the letters
      var candidate = parts[i].replace(/[0-9]/g, '').replace(/\b[A-Z]{2}\b/g, '').trim();
      if (candidate.length > 1) city = candidate;
    }
    return { city: city, country: country };
  }

  function coordsFromUrl(url) {
    if (!url) return null;
    var m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            url.match(/[?&]q=(-?\d+\.\d+)(?:%2C|,)(-?\d+\.\d+)/) ||
            url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    return m ? { lat: parseFloat(m[1]), lng: parseFloat(m[2]) } : null;
  }

  function parseCsvLine(line) {
    var out = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQ) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function importOne(entry) {
    // entry: {name, lat, lng, address, url}
    if (typeof entry.lat !== 'number' || isNaN(entry.lat)) return false;
    var dup = places.some(function (p) {
      return p.name.toLowerCase() === entry.name.toLowerCase() &&
        Math.abs(p.lat - entry.lat) < 0.001 && Math.abs(p.lng - entry.lng) < 0.001;
    });
    if (dup) return false;
    var loc = cityFromAddress(entry.address);
    places.push({
      id: uid(), name: entry.name || 'Saved place',
      lat: entry.lat, lng: entry.lng,
      city: loc.city, country: loc.country,
      cat: 'see', status: 'want', rating: null,
      added: today(), tripId: '', nextTime: '',
      tags: ['google-import'],
      gRating: null, gCount: null, gMapsUri: entry.url || null,
      memories: []
    });
    return true;
  }

  function importTakeout(filename, txt) {
    var added = 0, skipped = 0;
    if (/^\s*[{\[]/.test(txt)) {
      // GeoJSON: Takeout "Saved Places.json"
      var data = JSON.parse(txt);
      var features = data.features || [];
      features.forEach(function (f) {
        var props = f.properties || {};
        var loc = props.location || props.Location || {};
        var coords = (f.geometry && f.geometry.coordinates) || null;
        var lat = coords ? coords[1] : parseFloat(loc.latitude || loc.Latitude);
        var lng = coords ? coords[0] : parseFloat(loc.longitude || loc.Longitude);
        var name = props.Title || props.title || loc.name || loc['Business Name'] || 'Saved place';
        var address = loc.address || loc.Address || '';
        var url = props['Google Maps URL'] || props.google_maps_url || '';
        if (typeof lat === 'number' && !isNaN(lat)) {
          if (importOne({ name: name, lat: lat, lng: lng, address: address, url: url })) added++;
        } else skipped++;
      });
    } else {
      // CSV list export: Title,Note,URL[,Comment...]
      var lines = txt.split(/\r?\n/).filter(function (l) { return l.trim(); });
      lines.slice(1).forEach(function (line) {
        var cells = parseCsvLine(line);
        var name = cells[0] || 'Saved place';
        var url = cells.find(function (c) { return c.indexOf('google.com/maps') !== -1 || c.indexOf('goo.gl') !== -1; }) || '';
        var c = coordsFromUrl(url);
        if (c) {
          if (importOne({ name: name, lat: c.lat, lng: c.lng, address: '', url: url })) added++;
        } else skipped++;
      });
    }
    return { added: added, skipped: skipped };
  }

  // ---------- Stats / toast ----------
  function updateStats() {
    var been = places.filter(function (p) { return p.status === 'been'; });
    var cities = {};
    been.forEach(function (p) { if (p.city) cities[p.city + '|' + p.country] = 1; });
    var want = places.length - been.length;
    var nCities = Object.keys(cities).length;
    var parts = [
      nCities + (nCities === 1 ? ' city' : ' cities'),
      been.length + (been.length === 1 ? ' place' : ' places')
    ];
    if (trips.length) parts.push(trips.length + (trips.length === 1 ? ' trip' : ' trips'));
    if (want) parts.push(want + ' on the wishlist');
    document.getElementById('stats').textContent = parts.join(' · ');
  }

  // ---------- Export / import ----------
  function buildExport() {
    var ids = [];
    places.forEach(function (p) { (p.photos || []).forEach(function (id) { ids.push(id); }); });
    return Promise.all(ids.map(function (id) {
      return getPhoto(id).then(function (blob) {
        if (!blob) return null;
        return new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { res([id, fr.result]); };
          fr.onerror = function () { res(null); };
          fr.readAsDataURL(blob);
        });
      }).catch(function () { return null; });
    })).then(function (pairs) {
      var photos = {};
      pairs.filter(Boolean).forEach(function (pr) { photos[pr[0]] = pr[1]; });
      return { version: 3, exported: today(), places: places, trips: trips, photos: photos };
    });
  }

    f.text().then(function (txt) {
      try {
        var data = JSON.parse(txt);
        var inPlaces = Array.isArray(data) ? data : (data.places || []);
        var inTrips = Array.isArray(data) ? [] : (data.trips || []);
        var knownP = {}, knownT = {};
        places.forEach(function (p) { knownP[p.id] = 1; });
        trips.forEach(function (t) { knownT[t.id] = 1; });
        var added = 0;
        inTrips.forEach(function (t) {
          if (t && t.id && !knownT[t.id]) { trips.push(t); }
        });
        inPlaces.forEach(function (p) {
          if (p && p.id && !knownP[p.id] && typeof p.lat === 'number' && typeof p.lng === 'number') {
            places.push(p); added++;
          }
        });
        var photoMap = (!Array.isArray(data) && data.photos) ? data.photos : {};
        var photoIds = Object.keys(photoMap);
        var restorePhotos = Promise.all(photoIds.map(function (id) {
          return fetch(photoMap[id]).then(function (r) { return r.blob(); })
            .then(function (blob) { return putPhoto(id, blob); })
            .catch(function () { /* skip a bad photo, keep the rest */ });
        }));
        savePlaces(); saveTrips();
        restorePhotos.then(function () {
          refreshMarkers(); render(); updateStats();
          toast('Imported ' + added + ' place' + (added === 1 ? '' : 's') +
            (photoIds.length ? ' + ' + photoIds.length + ' photo' + (photoIds.length === 1 ? '' : 's') : ''));
        });
      } catch (err) {
        toast("Couldn't read that file — expected a Souvenir export (.json)");
      }
    });

      if (!el) { finish(); return; }

        if (idx === COACH.length - 1) finish();
        else { idx++; paint(); }

      mk('Roscioli', 41.8935, 12.4746, 'Rome', 'Italy', 'eat', 'loved', 'The carbonara that ruined all other carbonara.', 'Reserve the wine cellar table.', ['best-of'], '', 4.3, 6354)
    );
    savePlaces(); saveTrips();
  }

  var qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1') {
    localStorage.setItem(TOUR_KEY, '1');
    if (!places.length) seedDemo();
    if (qs.get('tab')) view.tab = qs.get('tab');
    if (qs.get('cal') === '1') view.tripsView = 'cal';
  }

  // ---------- Boot ----------
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline mode just won't cache */ });
  }
  refreshMarkers();
  render();
  updateStats();
  if (places.length) {
    var group = L.featureGroup(Object.keys(markers).map(function (k) { return markers[k]; }));
    map.fitBounds(group.getBounds().pad(0.3), { maxZoom: 6 });
  }
  if (!localStorage.getItem(TOUR_KEY)) showTour();
})();
</script>
